<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lamba Girişi — Deneme 1</title>
  <meta name="description" content="Tasarım denemesi: ipi çekince yanan lamba ve ışıkla beliren giriş kartı.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#080706">
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lamp.css?v=3">
  <!-- JavaScript kapalıysa form ışığı beklemeden görünsün. -->
  <noscript><style>.card,.card [data-reveal]{opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;pointer-events:auto!important}.cord-hint{display:none}</style></noscript>
</head>
<body>
  <main class="scene" data-lamp-state="off">
    <a class="back" href="../">← malibag.github.io</a>
    <p class="tag">Deneme 1 · Lamba girişi</p>

    <!-- Işık katmanları dekoratiftir; tıklamaları engellemez. -->
    <div class="ambient" aria-hidden="true"></div>
    <div class="floor-glow" aria-hidden="true"></div>

    <div class="lamp-area">
      <div class="lamp">
        <div class="halo" aria-hidden="true"></div>
        <div class="cone cone-wide" aria-hidden="true"></div>
        <div class="cone cone-main" aria-hidden="true"></div>

        <svg class="lamp-svg" viewBox="0 0 240 560" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="shade-fill" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#1f1b17"/>
              <stop offset=".55" stop-color="#3b332b"/>
              <stop offset="1" stop-color="#1a1714"/>
            </linearGradient>
            <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#2b2621"/>
              <stop offset=".5" stop-color="#4a4036"/>
              <stop offset="1" stop-color="#241f1b"/>
            </linearGradient>
          </defs>
          <!-- Gövde ve taban -->
          <rect class="lamp-pole" x="117" y="36" width="6" height="482" rx="3" fill="url(#metal)"/>
          <g class="lamp-base">
            <ellipse cx="120" cy="532" rx="74" ry="14" fill="#14110e"/>
            <path d="M52 520 Q120 500 188 520 L188 528 Q120 546 52 528 Z" fill="url(#metal)"/>
          </g>
          <!-- Başlık (sallanan katman): ampul başlığın altında durur -->
          <g id="lamp-shade" class="lamp-shade">
            <rect x="112" y="26" width="16" height="16" rx="4" fill="url(#metal)"/>
            <circle class="bulb" cx="120" cy="124" r="15" fill="#3a332c"/>
            <circle class="bulb-lit" cx="120" cy="124" r="15" fill="#ffe3a3"/>
            <path d="M86 40 H154 L198 128 H42 Z" fill="url(#shade-fill)"/>
            <path d="M42 128 H198" stroke="#5a4c3d" stroke-width="2"/>
            <ellipse class="shade-rim" cx="120" cy="128" rx="78" ry="7" fill="#0d0b09"/>
            <ellipse class="shade-rim-lit" cx="120" cy="128" rx="78" ry="7" fill="#ffb347"/>
          </g>
        </svg>

        <!-- İp: gerçek bir düğme; fare, dokunma, Enter ve Space ile çalışır. -->
        <button id="lamp-cord" class="cord" type="button" aria-label="Lambayı aç" aria-pressed="false" aria-controls="login-card">
          <span class="cord-line" aria-hidden="true"></span>
          <span class="cord-bead" aria-hidden="true"></span>
        </button>
      </div>
      <p class="cord-hint" aria-hidden="true"><span class="hint-off">Işığı açmak için ipi çek</span><span class="hint-on">Kapatmak için ipi tekrar çek</span></p>
    </div>

    <section id="login-card" class="card" aria-labelledby="login-title">
      <h1 id="login-title" data-reveal style="--i:0">Tekrar hoş geldin</h1>
      <p class="card-lead" data-reveal style="--i:1">Hesabına giriş yap. Bu sayfa bir tasarım denemesidir; bilgiler hiçbir yere gönderilmez.</p>

      <form id="login-form" class="form" action="#" method="post">
        <div class="field" data-reveal style="--i:2">
          <label for="email">E-posta</label>
          <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required>
        </div>
        <div class="field" data-reveal style="--i:3">
          <label for="password">Parola</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
        </div>
        <div class="form-row" data-reveal style="--i:4">
          <label class="remember"><input type="checkbox" name="remember"> Beni hatırla</label>
          <a id="forgot-link" class="help-link" href="#">Parolamı unuttum</a>
        </div>
        <button class="submit" type="submit" data-reveal style="--i:5">Giriş yap</button>
        <p id="login-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="lamp.js?v=1" defer></script>
</body>
</html>
