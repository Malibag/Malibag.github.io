# Misket turnuvası: her gün 12:00, 18:00, 21:00 (Türkiye) yarışlarının sonuçlarını önceden hesaplar.
name: Misket sonuçları
on:
  schedule:
    - cron: '30 19 * * *'   # 22:30 TR — ertesi günün turnuvaları
    - cron: '0 5 * * *'     # 08:00 TR — bugünkü eksikse
    - cron: '0 13 * * *'    # 16:00 TR — yedek
  workflow_dispatch:
permissions:
  contents: write
concurrency: misket-sonuc
jobs:
  hesapla:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock @dimforge/rapier3d-deterministic-compat@0.19.3
      - name: Hesapla
        run: |
          node misket/tools/hesapla.mjs "$(TZ=Europe/Istanbul date +%F)"
          node misket/tools/hesapla.mjs "$(TZ=Europe/Istanbul date -d tomorrow +%F)"
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add misket/sonuc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "misket: turnuva sonuçları"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
